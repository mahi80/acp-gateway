[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-gateway"
version = "0.1.0"
description = "ACP gateway — ACP's governance controls applied to LLM traffic with no change to the agent's code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0",
    # The controls come from the ACP SDK. Private; pinned to mahi80/rbi @ 696b369 (acp-sdk 0.8.5).
    "acp-sdk @ git+https://github.com/mahi80/rbi.git@696b369#subdirectory=acp-sdk",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
acp-gateway = "acp_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["acp_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
